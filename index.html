<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kisan Saathi — Smart Farming Companion</title>
  <meta name="description" content="Kisan Saathi: crop planning, soil health, weather, markets, schemes and agricultural assistance.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="authScreen" class="auth-screen"><div class="auth-card"><div class="auth-logo">🌾</div><h1>Kisan Saathi</h1><p class="auth-sub">Your smart farming companion</p><div id="authError" class="auth-error"></div><form id="loginForm"><label>Username / Email / Phone</label><input id="loginEmail" type="text" autocomplete="username" inputmode="text" placeholder="Enter username, email or phone number" required><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Your password" required><button class="auth-primary" type="submit">Sign in</button></form><div class="auth-divider"><span>or</span></div><a class="google-btn" href="/api/auth/google">Continue with Google</a><p class="auth-switch">New here? <button id="showRegister" type="button">Create account</button></p><form id="registerForm" class="hidden"><label>Full name</label><input id="regName" required><label>Email</label><input id="regEmail" type="email" required><label>Password</label><input id="regPassword" type="password" minlength="8" required><button class="auth-primary" type="submit">Create account</button><p class="auth-switch">Already registered? <button id="showLogin" type="button">Sign in</button></p></form></div></div>
<div id="appShell" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><div class="logo">🌾</div><div><b>Kisan Saathi</b><span>Smart farming companion</span></div></div>
    <nav id="nav">
      <button class="nav active" data-page="dashboard">🏠 <span>Dashboard</span></button>
      <button class="nav" data-page="crop">🌱 <span>Crop Planning</span></button>
      <button class="nav" data-page="soil">🧪 <span>Soil Health</span></button>
      <button class="nav" data-page="health">📷 <span>Crop Health</span></button>
      <button class="nav" data-page="weather">🌦️ <span>Weather</span></button>
      <button class="nav" data-page="markets">💰 <span>Markets</span></button>
      <button class="nav" data-page="inputs">🛒 <span>Inputs</span></button>
      <button class="nav" data-page="schemes">🏛️ <span>Schemes</span></button>
      <button class="nav" data-page="insurance">🛡️ <span>Insurance</span></button>
      <button class="nav" data-page="experts">👨‍🌾 <span>Experts</span></button>
      <button class="nav" data-page="learning">🎓 <span>Learning</span></button>
      <button class="nav" data-page="assistant">🤖 <span>AI Saathi</span></button>
    </nav>
    <div class="side-bottom"><button class="nav" data-page="profile">👤 <span>My Farm</span></button><button class="nav" data-page="settings">⚙️ <span>Settings</span></button></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menu" class="icon-btn">☰</button>
      <div class="location">📍 <b>Siddipet, Telangana</b><span>Farm location</span></div>
      <div class="top-actions">
        <button class="icon-btn" id="voiceBtn" title="Voice">🎙️</button>
        <button class="icon-btn" id="bell" title="Alerts">🔔<i></i></button>
        <div class="avatar">RK</div>
      </div>
    </header>

    <div id="content"></div>
  </main>
</div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
